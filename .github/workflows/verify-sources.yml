# Weekly deterministic check that every image source Pieria ships still resolves to a real
# image — the regime that catches external source-rot (e.g. Wikimedia tightening its thumbnail
# whitelist, which once left a fresh box booting empty) before a user hits it.
#
# Scope here is seed + catalog (the things we ship). Subscriptions are intentionally excluded:
# they live in a user's local DB, which doesn't exist in CI — run `--scope subscriptions` locally.
#
# As of 2026-06-26 this job is EXPECTED GREEN. The Art-Institute-of-Chicago catalog items were
# re-sourced onto Wikimedia Commons (tools/resource_artic.py) after AIC's IIIF host went behind a
# Cloudflare challenge; Cleveland turned out fine (a transient earlier blip). 163 unmatched AIC works
# are PARKED in static/catalog/_pending_artic.json (not shipped), so they can't fail this check. If
# this goes red, an external source rotted again — investigate, don't suppress.
name: Verify Sources

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}    # allow on-demand runs from the Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify seed + catalog source URLs
        run: python -m tools.verify_sources --scope seed,catalog
