[Service]
# sd-image-prep --full deletes the SSH host keys, and on Trixie nothing regenerates them: both
# regenerate_ssh_host_keys.service and sshd-keygen.service carry ConditionFirstBoot=yes, which an
# empty /etc/machine-id never satisfies. So an owner who enables SSH got "no hostkeys available".
# Make sshd create its own missing keys at start, on any distro. `ssh-keygen -A` only creates key
# types that are absent, so it never rotates existing keys. The empty line resets Debian's own
# ExecStartPre so keygen runs BEFORE the `sshd -t` config test (which fails without keys).
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
