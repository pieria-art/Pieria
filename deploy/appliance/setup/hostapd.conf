# Pieria — first-run setup access point (hostapd).
# Brings up an OPEN "Pieria-Setup" Wi-Fi so a phone can reach the setup wizard on first boot.
# Open (no password) is deliberate: the user has nothing to type yet, the AP is up for minutes only,
# and it serves nothing sensitive (it only collects config to write locally). Installed by install.sh;
# started by sd-setup-boot, torn down once the wizard commits.
interface=wlan0
driver=nl80211
ssid=Pieria-Setup
hw_mode=g
channel=6
auth_algs=1
wmm_enabled=0
ignore_broadcast_ssid=0
