# Pieria — first-run setup DHCP + DNS catch-all (dnsmasq).
# Hands out addresses on the Pieria-Setup AP and resolves EVERY hostname to the Pi (10.0.0.1) so the
# phone's captive-portal probe (connectivitycheck / hotspot-detect / ncsi) lands on the wizard and the
# "Sign in to network" sheet pops. Installed by install.sh; used only while sd-setup-boot runs the AP.
interface=wlan0
bind-interfaces
except-interface=lo
dhcp-range=10.0.0.10,10.0.0.100,255.255.255.0,12h
dhcp-option=3,10.0.0.1
dhcp-option=6,10.0.0.1
# DNS catch-all: any name -> the Pi (the wizard host).
address=/#/10.0.0.1
no-resolv
