<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pieria Remote</title>
    
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pieria">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <!-- iOS ignores SVG for the home-screen icon, so ship a real 180x180 PNG (logo on brand-dark). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/app.css">

    <style>
        /* Remote — mobile-first PWA; shared tokens come from app.css. */
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            /* Installed to the iOS home screen the Remote runs fullscreen under the status bar/Dynamic
               Island (black-translucent + viewport-fit=cover). Pad by the safe-area insets so the top
               (and rounded corners) aren't clipped — at least 20px, more where the notch needs it. */
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                     max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        body.force-portrait {
            width: 100vh; height: 100vw;
            transform: rotate(-90deg); transform-origin: top left;
            position: absolute; top: 100%; left: 0;
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; text-align: center; }

        .control-panel {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1rem; color: #94a3b8; }

        select {
            background: #0f172a; border: 1px solid var(--border-color);
            color: white; padding: 12px; border-radius: 10px; font-size: 1rem;
            outline: none; width: 100%;
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .remote-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white; padding: 25px 15px; border-radius: 16px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .remote-btn:active { transform: scale(0.95); background: var(--accent-color); }
        .remote-btn span { font-size: 0.7rem; font-weight: normal; opacity: 0.6; }
        /* The collection the selected display is currently showing. */
        .remote-btn.active-collection {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--accent-color), 0 4px 6px rgba(0,0,0,0.2);
        }
        .remote-btn.active-collection::after {
            content: '▶ now showing'; font-size: 0.6rem; font-weight: 600; opacity: 0.9;
            color: var(--accent-color); letter-spacing: 0.05rem;
        }

        /* "Now showing" panel — what the selected display currently has on screen. */
        #now-playing {
            display: none; align-items: center; gap: 12px;
            background: #0f172a; border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px;
        }
        #np-thumb {
            width: 56px; height: 56px; flex: 0 0 auto; border-radius: 8px;
            object-fit: cover; background: #1e293b;
        }
        #np-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1rem; color: var(--accent-color); }
        #np-title { font-weight: 600; font-size: 0.95rem; margin-top: 2px; }
        #np-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

        /* "Read placard" — the placard text on the phone. This is the only placard an e-ink panel
           gets: render_for_epaper bakes no text, so the phone in your hand IS the wall label. */
        #placard-tile { display: none; flex-direction: column; }
        #placard-toggle {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        #placard-toggle .caret { color: var(--accent-color); font-size: 0.7rem; }
        #placard-body {
            background: #0f172a; border: 1px solid var(--border-color); border-top: none;
            border-radius: 0 0 12px 12px; padding: 14px; margin-top: -6px;
        }
        .pl-title { font-size: 1.05rem; font-weight: 600; }
        .pl-series { font-size: 0.85rem; font-style: italic; color: #cbd5e1; margin-top: 2px; }
        .pl-artist { font-size: 0.9rem; color: #cbd5e1; margin-top: 4px; }
        .pl-meta { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
        /* Capped + scrollable: a long narrative must not shove the transport controls and the
           collection grid off the bottom of a phone screen. */
        .pl-desc { font-size: 0.9rem; line-height: 1.6; margin-top: 12px; max-height: 40vh; overflow-y: auto; }
        .pl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .pl-tag {
            background: #1e293b; border: 1px solid var(--border-color); color: #cbd5e1;
            padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;
        }
        .pl-learn { display: inline-block; margin-top: 14px; color: var(--accent-color); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        #screen-hint { font-size: 0.7rem; color: #94a3b8; margin: 6px 0 0; }
        .remote-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .footer { 
            margin-top: auto; 
            padding: 40px 20px 20px; 
            font-size: 0.7rem; 
            opacity: 0.6; 
            display: flex; 
            justify-content: space-between; 
            width: 100%; 
            max-width: 500px;
            box-sizing: border-box;
            color: #94a3b8;
        }
        .footer a { color: var(--accent-color); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <img src="/logo.svg" alt="Logo" style="height: 32px;">
        <h1 style="margin: 0; font-size: 1.5rem;">Pieria Remote</h1>
    </div>
    
    <div class="control-panel">
        <div style="display:flex; flex-direction:column; gap:10px;">
            <label>Target Display (Active)</label>
            <select id="display-select">
                <!-- Populated dynamically -->
                <option value="">Searching for displays...</option>
            </select>
        </div>

        <div id="now-playing">
            <img id="np-thumb" alt="">
            <div style="min-width:0;">
                <div id="np-label">▶ Now showing</div>
                <div id="np-title"></div>
                <div id="np-sub"></div>
            </div>
        </div>

        <!-- Read the placard here, on the phone. Distinct from "Show Placard on Screen" below, which pushes
             the placard onto the display itself. Static skeleton; filled by textContent only. -->
        <div id="placard-tile">
            <button id="placard-toggle" aria-expanded="false" aria-controls="placard-body">
                <span class="caret">▸</span> Read placard
            </button>
            <div id="placard-body" hidden>
                <div class="pl-title"></div>
                <div class="pl-series"></div>
                <div class="pl-artist"></div>
                <div class="pl-meta"></div>
                <div class="pl-desc"></div>
                <div class="pl-tags"></div>
                <a class="pl-learn" target="_blank" rel="noopener">Learn more →</a>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div style="display:flex; flex-direction:column; gap:5px;">
                <label>Display Mode</label>
                <select id="mode-select" onchange="sendRemoteCommand('set_mode', {mode: this.value})">
                    <option value="ken-burns">Ken Burns</option>
                    <option value="static-crop">Static Crop</option>
                    <option value="contain-matte">Contain Matte</option>
                </select>
            </div>
            <div style="display:flex; flex-direction:column; gap:5px; justify-content: flex-end;">
                <button id="show-on-screen-btn" class="remote-btn" style="padding: 12px; font-size: 0.8rem;" onclick="sendRemoteCommand('show_placard')">
                    Show Placard on&nbsp;Screen
                </button>
            </div>
        </div>
        <p id="screen-hint" style="display:none;"></p>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button id="prev-btn" class="remote-btn" style="padding: 15px;" onclick="sendRemoteCommand('prev_image')">
                ◀ Previous
            </button>
            <button id="next-btn" class="remote-btn" style="padding: 15px;" onclick="sendRemoteCommand('next_image')">
                Next ▶
            </button>
        </div>
    </div>

    <div id="playlist-grid" class="playlist-grid"></div>

    <div class="footer">
        <span>Pieria</span>
        <span><a href="/admin">⚙ Admin</a> &nbsp;·&nbsp; <a href="/help">Help</a></span>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('rotate') === 'true') document.body.classList.add('force-portrait');

        const API_BASE = window.location.origin;
        let lastKnownSig = null;        // R1: sentinel so the FIRST poll always renders, even when empty
                                        // (was []; an empty first result equalled [] and never populated,
                                        // leaving the static "Searching…" placeholder up forever).
        let displaysById = {};          // display_id -> {display_id, playlist, artwork, live} from the last poll
        let placardArtId = null;        // artwork the placard tile currently describes
        let placardOpen = false;        // survives polls, so the tile doesn't slam shut every 5s
        let placardSeq = 0;             // drops out-of-order fetch responses

        async function init() {
            await fetchPlaylists();
            await refreshActiveDisplays();
            // Update the now-showing panel + collection highlight when the target display changes.
            document.getElementById('display-select').addEventListener('change', updateNowPlaying);
            document.getElementById('placard-toggle').addEventListener('click', togglePlacard);
            // Poll for new displays (and their now-playing) every 5 seconds
            setInterval(refreshActiveDisplays, 5000);
        }

        // R2: a small self-contained toast (this page doesn't load app-core.js) — replaces native alert().
        function toast(msg) {
            let t = document.getElementById('remote-toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'remote-toast';
                t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;padding:10px 18px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:999;font-size:.9rem;opacity:0;transition:opacity .25s;';
                document.body.appendChild(t);
            }
            t.textContent = msg; t.style.opacity = '1';
            clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 2600);
        }

        // R1: hint under the display selector when none are connected.
        function _setHint(msg) {
            const sel = document.getElementById('display-select');
            let h = document.getElementById('display-hint');
            if (!h) {
                h = document.createElement('p');
                h.id = 'display-hint';
                h.style.cssText = 'font-size:.8rem;color:#94a3b8;margin:6px 0 0;';
                sel.parentNode.appendChild(h);
            }
            h.textContent = msg; h.style.display = msg ? '' : 'none';
        }

        /**
         * Dynamically discovers connected displays from the server.
         */
        async function refreshActiveDisplays() {
            try {
                const response = await fetch(`${API_BASE}/api/remote/displays`);
                const displays = await response.json();   // [{display_id, playlist, artwork, live}]

                displaysById = {};
                displays.forEach(d => { displaysById[d.display_id] = d; });

                // Only re-render the <select> when something in it actually changes (preserves the open
                // dropdown + selection); now-playing is refreshed every poll below since it advances
                // independently of the display list. Liveness is part of the key because it's part of
                // the option's TEXT ("— asleep") — keying on ids alone froze that label forever, since
                // a panel dozing off doesn't change the id set.
                const sig = displays.map(d => `${d.display_id}|${d.live ? 1 : 0}`);
                if (JSON.stringify(sig) !== JSON.stringify(lastKnownSig)) {
                    lastKnownSig = sig;
                    populateDisplaySelect(displays);
                }
                updateNowPlaying();
            } catch (err) { console.error('Discovery failed', err); }
        }

        function populateDisplaySelect(displays) {
            const select = document.getElementById('display-select');
            const currentVal = select.value;
            select.innerHTML = '';

            if (displays.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "No active displays found";
                select.appendChild(opt);
                _setHint("Open your server's address on a screen (a TV, tablet, or browser) and it'll appear here.");
                return;
            }
            _setHint("");

            displays.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.display_id;
                const label = d.display_id === 'default' ? "Default Display" : `Display: ${d.display_id}`;
                // Asleep = a pull-mode frame (e-ink) between wakes. Still listed, still showing art —
                // just not reachable by a command until it next checks in.
                opt.textContent = d.live ? label : `${label} — asleep`;
                select.appendChild(opt);
            });

            // Restore selection if it still exists
            if (displays.some(d => d.display_id === currentVal)) {
                select.value = currentVal;
            }
        }

        // Fill the "Now showing" panel + highlight the active collection for the selected display.
        function updateNowPlaying() {
            const sel = document.getElementById('display-select');
            const info = displaysById[sel.value];
            const panel = document.getElementById('now-playing');

            // Highlight the collection button the display is currently playing (if any).
            document.querySelectorAll('#playlist-grid .remote-btn').forEach(b => {
                b.classList.toggle('active-collection', !!(info && info.playlist && b.dataset.collection === info.playlist));
            });

            updateCommandAvailability(info);

            const art = info && info.artwork;
            if (!art) { panel.style.display = 'none'; syncPlacard(null); return; }
            panel.style.display = 'flex';
            document.getElementById('np-thumb').src = art.thumb_url;
            // textContent throughout — titles/artist names are museum/user data, never trusted as markup.
            const artist = (!art.is_personal && art.agent_name) ? ` — ${art.agent_name}` : '';
            document.getElementById('np-title').textContent = (art.title || 'Untitled') + artist;
            document.getElementById('np-sub').textContent = info.playlist ? `in “${info.playlist}” collection` : '';
            syncPlacard(art);
        }

        // A sleeping (pull-mode) display holds no socket, so a queued command would sit in the
        // remote_commands table unread — and fire in a burst if that id ever did connect. Grey the whole
        // command surface rather than letting taps vanish into it.
        function updateCommandAvailability(info) {
            const live = !!(info && info.live);
            ['show-on-screen-btn', 'prev-btn', 'next-btn', 'mode-select'].forEach(id => {
                document.getElementById(id).disabled = !live;
            });
            document.querySelectorAll('#playlist-grid .remote-btn').forEach(b => {
                if (b.dataset.empty !== '1') b.disabled = !live;
            });
            const hint = document.getElementById('screen-hint');
            const show = info && !live;
            hint.textContent = show ? "This panel shows art only — read the placard above." : '';
            hint.style.display = show ? '' : 'none';
        }

        // --- Placard ------------------------------------------------------------------------------
        // Fetched only when the now-playing artwork CHANGES, not on every 5s poll.
        function syncPlacard(art) {
            const tile = document.getElementById('placard-tile');
            if (!art) { tile.style.display = 'none'; placardArtId = null; return; }
            if (art.id === placardArtId) return;          // same piece — leave the rendered tile alone
            placardArtId = art.id;
            fetchPlacard(art.id);
        }

        async function fetchPlacard(id) {
            const seq = ++placardSeq;
            try {
                const r = await fetch(`${API_BASE}/artworks/${id}/placard`);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const m = await r.json();
                // Drop a response that lost the race (display flipped, or the art advanced) — fetches
                // can resolve out of order.
                if (seq !== placardSeq || id !== placardArtId) return;
                renderPlacard(m);
            } catch (err) {
                console.error('Placard fetch failed', err);   // a missing placard is not a user error
                if (seq === placardSeq) document.getElementById('placard-tile').style.display = 'none';
            }
        }

        // Mirrors updatePlacard() in app.js — same fields, same rules, so the phone and the TV agree.
        // No stripMd() here: the server already stripped title/series/description on the way out.
        function renderPlacard(m) {
            const tile = document.getElementById('placard-tile');
            if (!m || !m.title) { tile.style.display = 'none'; return; }
            tile.style.display = 'flex';

            const el = cls => tile.querySelector('.' + cls);
            const series = el('pl-series'), artist = el('pl-artist'), meta = el('pl-meta');
            const desc = el('pl-desc'), tags = el('pl-tags'), learn = el('pl-learn');
            el('pl-title').textContent = m.title;
            tags.innerHTML = '';                          // clearing only; content is textContent below

            if (m.is_personal) {
                // Personal photo: caption + optional date. No artist/medium/culture/tags jargon, and
                // nothing to "learn more" about.
                series.style.display = 'none';
                artist.textContent = m.date_display || m.creation_date || '';
                meta.textContent = '';
                desc.textContent = '';
                tags.style.display = 'none';
                learn.style.display = 'none';
                return;
            }

            series.style.display = m.series ? '' : 'none';
            series.textContent = m.series || '';
            const role = (m.agent_role && m.agent_role !== 'Artist') ? ` (${m.agent_role})` : '';
            const made = m.creation_date ? ` • ${m.creation_date}` : '';
            artist.textContent = `${m.agent_name || 'Unknown Artist'}${role}${made}`;

            // Drop date_display when it just repeats the byline's creation_date (app.js C2).
            const dd = m.date_display;
            const dupDate = dd && dd.toLowerCase() === (m.creation_date || '').toLowerCase();
            meta.textContent = [m.cultural_context, m.medium, dupDate ? null : dd].filter(Boolean).join(' | ');
            desc.textContent = m.description || '';

            tags.style.display = '';
            (m.tags || '').split(',').forEach(t => {
                if (!t.trim()) return;
                const span = document.createElement('span');
                span.className = 'pl-tag';
                span.textContent = t.trim();
                tags.appendChild(span);
            });

            const artId = Number(m.id);
            learn.style.display = Number.isFinite(artId) ? '' : 'none';
            if (Number.isFinite(artId)) learn.href = `/art/${artId}`;
        }

        function togglePlacard() {
            placardOpen = !placardOpen;
            document.getElementById('placard-body').hidden = !placardOpen;
            document.getElementById('placard-toggle').setAttribute('aria-expanded', String(placardOpen));
            document.querySelector('#placard-toggle .caret').textContent = placardOpen ? '▾' : '▸';
        }

        async function fetchPlaylists() {
            try {
                const response = await fetch(`${API_BASE}/playlists`);
                const playlists = await response.json();
                renderGrid(playlists);
            } catch (err) { console.error('Fetch failed', err); }
        }

        function renderGrid(playlists) {
            const grid = document.getElementById('playlist-grid');
            grid.innerHTML = '';
            playlists.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'remote-btn';
                btn.dataset.collection = p.name || '';   // used to highlight the display's active collection
                // textContent, not innerHTML — collection names are user data and must not render as markup.
                btn.textContent = (p.name || '') + ' ';
                const span = document.createElement('span');
                const n = p.artworks?.length || 0;
                span.textContent = n === 1 ? '1 piece' : `${n} pieces`;   // R4: pluralize
                btn.appendChild(span);
                if (n === 0) {   // R4: an empty collection would blank the display — don't let it be tapped
                    btn.disabled = true;
                    btn.dataset.empty = '1';   // stays disabled even when the display is live
                    btn.style.opacity = '0.5';
                } else {
                    btn.onclick = () => setPlaylist(p.name);
                }
                grid.appendChild(btn);
            });
        }

        async function setPlaylist(playlistName) {
            await sendRemoteCommand('set_playlist', { playlist: playlistName });
        }

        async function sendRemoteCommand(action, data = {}) {
            const targetDisplay = document.getElementById('display-select').value;
            if (!targetDisplay) { toast("Select an active display first"); return; }   // R2: no native alert()

            try {
                const response = await fetch(`${API_BASE}/api/remote/change`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_display: targetDisplay,
                        action: action,
                        ...data
                    })
                });
                if (response.ok && window.navigator.vibrate) window.navigator.vibrate(50);
            } catch (err) { console.error('Remote command failed', err); }
        }

        init();
    </script>
</body>
</html>
