<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Screen Docent</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="styles.css">
    <!-- QRCode.js — vendored locally so the display works fully offline / air-gapped -->
    <script src="/vendor/qrcode.min.js"></script>
    <style>
        /* Empty state — shown instead of a black screen when there's no art yet. */
        #empty-state { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:200; background:#0f172a; }
        #empty-state .empty-card { text-align:center; color:#cbd5e1; font-family:'Inter',system-ui,-apple-system,sans-serif; max-width:560px; padding:40px; }
        #empty-state .empty-logo { height:64px; opacity:0.85; margin-bottom:22px; }
        #empty-state h2 { font-size:2rem; margin:0 0 12px; color:#f1f5f9; font-weight:600; }
        #empty-state p { font-size:1.05rem; margin:6px 0; opacity:0.85; line-height:1.5; }
        #empty-state .empty-url { margin-top:18px; font-family:monospace; font-size:1.25rem; color:#10b981; }
        /* First-load hint pointing to the admin (auto-fades). */
        #manage-hint { position:absolute; bottom:24px; right:24px; z-index:210; background:rgba(15,23,42,0.85);
            color:#cbd5e1; padding:10px 16px; border-radius:10px; font-family:'Inter',system-ui,sans-serif;
            font-size:0.85rem; border:1px solid #334155; transition:opacity 0.8s ease; }
        #manage-hint span { color:#10b981; font-family:monospace; }
        /* Stacked glyph + caption on the rendering-mode toggles (clearer than glyph-only). */
        .mode-toggles button { display:inline-flex; flex-direction:column; align-items:center; gap:2px; line-height:1.1; }
        .mode-toggles .glyph { font-size:1.15em; }
        .mode-toggles .mode-label { font-size:0.6rem; opacity:0.8; letter-spacing:0.03em; }
    </style>
</head>
<body>
    <!-- Sleep defeater: invisible looping video keeps Fire Stick / TV browsers awake.
         Vendored locally (tiny 2x2 black clip) so it works offline — no external dependency. -->
    <video loop muted autoplay playsinline style="display:none; pointer-events:none;" src="/assets/keepawake.mp4"></video>

    <div id="display-container" class="ken-burns">
        <!-- Background matte layer for 'Mode C' -->
        <div id="matte-layer" class="matte-effect hidden"></div>
        
        <!-- Artwork Layers for Crossfading -->
        <div id="artwork-1" class="artwork-item active"></div>
        <div id="artwork-2" class="artwork-item"></div>

        <!-- R1-F2 Night & Quiet Hours veils. Warm (amber multiply) + dim (black) tint the ART only
             (z-index below the controls, so the placard/controls stay readable when you interact at
             night). Quiet blackout sits above everything for the software panel-off fallback. -->
        <div id="night-warm"></div>
        <div id="night-dim"></div>
        <div id="quiet-blackout"></div>

        <!-- UI Overlay Wrapper -->
        <div id="ui-wrapper" class="ui-overlay-wrapper">
            
            <!-- Invisible Trigger Zone for Controls (Bottom 33%) -->
            <div id="controls-trigger" style="position:absolute; bottom:0; left:0; width:100%; height:33vh; pointer-events:auto; z-index:90;"></div>

            <!-- Museum Placard (Phase 3) -->
            <div id="placard" class="museum-placard">
                <div class="placard-brand">
                    <img src="/logo.svg" alt="Screen Docent Logo" class="placard-logo">
                </div>
                <div class="placard-content">
                    <h1 id="art-title"></h1>
                    <h2 id="art-series" style="font-size: 0.95em; font-style: italic; opacity: 0.85; margin: 2px 0 0; font-weight: normal;"></h2>
                    <h2 id="art-agent-date"></h2>
                    <h3 id="art-museum-details" style="font-size: 0.9em; opacity: 0.8; margin-top: 5px; font-weight: normal;"></h3>
                    <p id="art-description"></p>
                    <div id="art-tags" class="tags-container"></div>
                </div>
                <div id="qrcode-container" class="qrcode-wrapper">
                    <div id="qrcode"></div>
                    <small>Scan to Learn More</small>
                </div>
            </div>

            <!-- Minimalist Control Overlay -->
            <div id="controls" class="controls-overlay">
                <div class="controls-brand">
                    <img src="/logo.svg" alt="Logo" class="controls-logo">
                </div>
                <div class="control-group">
                    <label>Navigate</label>
                    <div class="nav-controls">
                        <button id="prev-btn" title="Previous Image">❮</button>
                        <button id="next-btn" title="Next Image">❯</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Collection</label>
                    <div id="playlist-dropdown" class="custom-dropdown">
                        <button id="playlist-current" class="dropdown-trigger">Loading...</button>
                        <div id="playlist-options" class="dropdown-options hidden"></div>
                    </div>
                </div>
                <div class="control-group">
                    <label>Rendering Mode</label>
                    <div class="mode-toggles">
                        <button id="mode-a" class="active" title="Ken Burns pan" aria-label="Ken Burns pan"><span class="glyph">↔</span><span class="mode-label">Pan</span></button>
                        <button id="mode-b" title="Static crop" aria-label="Static crop"><span class="glyph">▣</span><span class="mode-label">Crop</span></button>
                        <button id="mode-c" title="Contain (matte)" aria-label="Contain (matte)"><span class="glyph">⛶</span><span class="mode-label">Fit</span></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notification Overlay -->
        <div id="overlay" class="fade-overlay">
            <h2 id="playlist-title"></h2>
        </div>

        <!-- Empty state (no approved art) — replaces a silent black screen with guidance -->
        <div id="empty-state" class="hidden">
            <div class="empty-card">
                <img src="/logo.svg" alt="" class="empty-logo">
                <h2>No art yet</h2>
                <p>Add artwork in the admin and it will appear here automatically.</p>
                <p class="empty-url" id="empty-admin-url"></p>
            </div>
        </div>

        <!-- First-load hint pointing to the admin (fades out after a few seconds) -->
        <div id="manage-hint" style="display:none;">Manage at <span id="manage-url"></span></div>
    </div>
    <script src="app.js?v=20260628b"></script>
</body>
</html>
